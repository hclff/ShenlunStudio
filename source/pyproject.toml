[project]
name = "shenlun-studio"
version = "0.9.5"
description = "申论研习：本地语料与有据可查的训练批改"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.9,<7", "lxml>=5", "pypdf>=6", "keyring>=25", "python-docx>=1.2,<2", "Pillow>=12,<13"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Keeps runs independent of a shared .pytest_cache directory; CI passes an
# explicit --basetemp per job as well.
addopts = "-p no:cacheprovider"
markers = [
    "slow: takes more than a few seconds or drives a real worker thread",
    "ui: constructs real Qt widgets",
    "probe: runs a release probe against synthetic databases",
]

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = ["build", "build-tmp", "dist", "validation", "assets"]

[tool.ruff.lint]
# Runtime-error rules only: syntax, undefined names, bad defaults, format
# strings. Style rules (F401/F841/…) are reported separately and cleaned up
# incrementally rather than blocking the pipeline.
select = ["E9", "F63", "F7", "F82"]
